services:
  - type: web
    name: nexa-pilot
    runtime: node
    region: frankfurt
    plan: standard
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: corepack enable && corepack prepare pnpm@11.5.3 --activate && pnpm install --frozen-lockfile && pnpm typecheck && pnpm test && NODE_OPTIONS=--max-old-space-size=3072 pnpm build
    # Was starter/512MB — OOM on heavy tender jobs (J-1103). Standard ≈ 2GB; still keep runtime lean.
    startCommand: NODE_OPTIONS=--max-old-space-size=1536 node apps/web/node_modules/next/dist/bin/next start apps/web --hostname 0.0.0.0 --port $PORT
    disk:
      name: nexa-pilot-data
      mountPath: /var/data
      # 10GB: live documents plus ~14 daily backups. Increase again if PDFs fill the disk.
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NEXA_STORE_PATH
        value: /var/data/nexa-pilot.sqlite
      - key: NEXA_STORE_DIR
        value: /var/data
      - key: NEXA_WORKSPACE_MODE
        value: demo
      - key: NEXA_PILOT_USER
        value: nexa
      - key: NEXA_PILOT_PIN
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://nexa-pilot.onrender.com
      - key: XERO_CLIENT_ID
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false
      - key: XERO_REDIRECT_URI
        value: https://nexa-pilot.onrender.com/api/integrations/xero/callback
      # simPRO — prefer OAuth refresh (same pattern as nexa-live)
      - key: SIMPRO_BASE_URL
        sync: false
      - key: SIMPRO_API_BASE_URL
        sync: false
      - key: SIMPRO_COMPANY_ID
        sync: false
      - key: SIMPRO_CLIENT_ID
        sync: false
      - key: SIMPRO_CLIENT_SECRET
        sync: false
      - key: SIMPRO_REFRESH_TOKEN_FILE
        value: /var/data/simpro_refresh_token.txt
      - key: SIMPRO_REFRESH_TOKEN
        sync: false
      - key: SIMPRO_WEBHOOK_SECRET
        sync: false
      # Optional bridges when direct OAuth is not used on pilot
      - key: SIMPRO_QUOTE_PUSH_URL
        sync: false
      - key: SIMPRO_QUOTE_PUSH_TOKEN
        sync: false
      - key: SIMPRO_SCHEDULER_BASE_URL
        value: https://ewg-hub-scheduler.onrender.com
      - key: SIMPRO_SCHEDULER_QUOTE_PUSH_URL
        sync: false
      - key: SIMPRO_SCHEDULER_HUB_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: NEXA_ENVIRONMENT
        value: pilot
      - key: NEXT_PUBLIC_NEXA_ENVIRONMENT
        value: pilot
      - key: NEXA_POSTGRES_MIRROR
        value: "1"
      - key: NEXA_TENANT_KEY
        value: ewg-pilot
      - key: DATABASE_URL
        fromDatabase:
          name: nexa-pilot-postgres
          property: connectionString
      # Optional nightly backup trigger (same value on the cron job below)
      - key: NEXA_BACKUP_CRON_SECRET
        sync: false

      # Optional off-site copies (Render disk is not enough on its own)
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_PREFIX
        sync: false
      - key: NEXA_BACKUP_DIR
        value: /var/data/backups
      - key: BACKUP_RETENTION_DAYS
        value: "14"

  # Nightly office backup (SQLite + takeoff/tender/survey files) onto /var/data/backups,
  # and to S3 when BACKUP_S3_* is set on nexa-pilot. Does not touch nexa-live.
  - type: cron
    name: nexa-pilot-nightly-backup
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "15 2 * * *"
    buildCommand: echo "nexa-office-backup-cron"
    startCommand: >-
      node --input-type=module -e "
      const secret = process.env.NEXA_BACKUP_CRON_SECRET;
      if (!secret) { console.error('NEXA_BACKUP_CRON_SECRET missing — set the same value on nexa-pilot and this cron'); process.exit(1); }
      const res = await fetch('https://nexa-pilot.onrender.com/api/office-backup/cron', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-nexa-backup-secret': secret,
        },
        body: '{}',
      });
      const text = await res.text();
      console.log(res.status, text.slice(0, 2000));
      if (!res.ok) process.exit(1);
      "
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NEXA_BACKUP_CRON_SECRET
        sync: false

databases:
  - name: nexa-pilot-postgres
    region: frankfurt
    plan: basic-256mb
    databaseName: nexa_pilot
    user: nexa_pilot
