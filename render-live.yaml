services:
  - type: web
    name: nexa-live
    runtime: node
    region: frankfurt
    # Core + SQLite hub needs headroom. Starter (512MB) OOMs → ECONNRESET / port-bind flaps.
    plan: standard
    autoDeploy: true
    healthCheckPath: /api/health
    # Build heap is set only here (not as a runtime env var).
    buildCommand: corepack enable && corepack prepare pnpm@11.5.3 --activate && pnpm install --frozen-lockfile --filter @hubflo/web... && NODE_OPTIONS=--max-old-space-size=3072 pnpm --filter @hubflo/web build && echo "nexa-runtime-mem=standard-1536-v1"
    # Bind $PORT explicitly; keep runtime heap under instance RAM (Standard = 2GB).
    startCommand: corepack enable && NODE_OPTIONS=--max-old-space-size=1536 pnpm --filter @hubflo/web exec next start --hostname 0.0.0.0 --port $PORT
    disk:
      name: nexa-live-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      # Do NOT set a large max-old-space-size here — it also hits the build step and
      # on Starter it caused OOM kills (ECONNRESET spam). Runtime heap is in startCommand.
      - key: NEXA_STORE_PATH
        value: /var/data/nexa-live.sqlite
      - key: NEXA_STORE_DIR
        value: /var/data
      - key: NEXA_WORKSPACE_MODE
        value: live
      # Stable key for encrypted mailbox app passwords (set once in Render dashboard)
      - key: NEXA_EMAIL_SETTINGS_SECRET
        sync: false
      - key: NEXA_AUTH_MODE
        value: users
      - key: NEXA_ADMIN_NAME
        value: Brian Kerr
      - key: NEXA_ADMIN_USERNAME
        value: brian.kerr
      - key: NEXA_ADMIN_EMPLOYEE_ID
        value: emp-brian
      - key: NEXA_ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://nexa-live.onrender.com
      # Preferred: direct simPRO OAuth for quote/job push while NeXa is the front end
      - key: SIMPRO_BASE_URL
        sync: false
      - key: SIMPRO_API_BASE_URL
        sync: false
      - key: SIMPRO_COMPANY_ID
        sync: false
      - key: SIMPRO_CLIENT_ID
        sync: false
      - key: SIMPRO_CLIENT_SECRET
        sync: false
      - key: SIMPRO_REFRESH_TOKEN_FILE
        value: /var/data/simpro_refresh_token.txt
      - key: SIMPRO_REFRESH_TOKEN
        sync: false
      - key: SIMPRO_DEFAULT_CUSTOMER_ID
        sync: false
      - key: SIMPRO_DEFAULT_SITE_ID
        sync: false
      - key: SIMPRO_WEBHOOK_SECRET
        sync: false
      # Shared with the EOD cron job — required for unattended simPRO refresh
      - key: NEXA_IMPORT_TICK_SECRET
        sync: false
      # Optional temporary scheduler bridge fallback
      - key: SIMPRO_SCHEDULER_BASE_URL
        value: https://ewg-hub-scheduler.onrender.com
      - key: SIMPRO_SCHEDULER_QUOTE_PUSH_URL
        sync: false
      - key: SIMPRO_SCHEDULER_JOB_PUSH_URL
        sync: false
      - key: SIMPRO_SCHEDULER_HUB_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXA_OPENAI_API_KEY
        sync: false
      - key: NEXA_ASSISTANT_OPENAI_MODEL
        value: gpt-4.1-mini
      # Optional UK PAF street lookup. Ideal Postcodes is preferred; getAddress.io is a fallback.
      # Without keys NeXa uses Ideal Postcodes sandbox (ak_test) then OpenStreetMap.
      - key: IDEAL_POSTCODES_API_KEY
        sync: false
      - key: GETADDRESS_API_KEY
        sync: false
      - key: NEXA_POSTCODE_LOOKUP_VERSION
        value: street-list-v3

  # Weekday end-of-day pull of fresh simPRO data into NeXa (same working set as Apply).
  # Set the same NEXA_IMPORT_TICK_SECRET on this cron and on nexa-live.
  - type: cron
    name: nexa-live-simpro-eod
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "0 18 * * 1-5"
    buildCommand: echo "nexa-simpro-eod-cron"
    startCommand: >-
      node --input-type=module -e "
      const secret = process.env.NEXA_IMPORT_TICK_SECRET;
      if (!secret) { console.error('NEXA_IMPORT_TICK_SECRET missing'); process.exit(1); }
      const res = await fetch('https://nexa-live.onrender.com/api/integrations/simpro/sync/cron', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-nexa-import-tick-secret': secret,
        },
        body: '{}',
      });
      const text = await res.text();
      console.log(res.status, text.slice(0, 2000));
      if (!res.ok) process.exit(1);
      "
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NEXA_IMPORT_TICK_SECRET
        sync: false

  # Monday 08:00 UTC board pack email (enable recipients in Core → Reports → Schedule email).
  - type: cron
    name: nexa-live-board-pack-monday
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "5 8 * * 1"
    buildCommand: echo "nexa-board-pack-cron"
    startCommand: >-
      node --input-type=module -e "
      const secret = process.env.NEXA_IMPORT_TICK_SECRET;
      if (!secret) { console.error('NEXA_IMPORT_TICK_SECRET missing'); process.exit(1); }
      const res = await fetch('https://nexa-live.onrender.com/api/reports/board-pack/cron', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-nexa-import-tick-secret': secret,
        },
        body: '{}',
      });
      const text = await res.text();
      console.log(res.status, text.slice(0, 2000));
      if (!res.ok) process.exit(1);
      "
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NEXA_IMPORT_TICK_SECRET
        sync: false

  # Hourly uptime probe. Retries through Render deploy 502s so cutovers do not page.
  - type: cron
    name: nexa-live-deploy-smoke
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "5 * * * *"
    buildCommand: echo "nexa-deploy-smoke-cron"
    startCommand: >-
      node --input-type=module -e "
      const secret = process.env.NEXA_IMPORT_TICK_SECRET;
      if (!secret) { console.error('NEXA_IMPORT_TICK_SECRET missing'); process.exit(1); }
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      let lastStatus = 0;
      let lastText = '';
      let lastOk = false;
      let lastDeployWindow = false;
      for (let attempt = 1; attempt <= 6; attempt++) {
        try {
          const res = await fetch('https://nexa-live.onrender.com/api/health/smoke', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-nexa-import-tick-secret': secret,
            },
            body: '{}',
          });
          lastStatus = res.status;
          lastText = await res.text();
          let body = null;
          try { body = JSON.parse(lastText); } catch {}
          lastOk = Boolean(body?.ok);
          lastDeployWindow = Boolean(body?.deployWindow);
          console.log(JSON.stringify({ attempt, status: lastStatus, ok: lastOk, deployWindow: lastDeployWindow, failed: body?.failed || [] }));
          if (res.ok && lastOk) process.exit(0);
        } catch (error) {
          console.log(JSON.stringify({ attempt, error: error instanceof Error ? error.message : String(error) }));
        }
        // ~6 attempts × 25s ≈ 2.5 minutes through a Render cutover.
        await sleep(25000);
      }
      console.error(lastStatus, lastText.slice(0, 4000));
      process.exit(1);
      "
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NEXA_IMPORT_TICK_SECRET
        sync: false
