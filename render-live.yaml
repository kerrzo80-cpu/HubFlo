services:
  - type: web
    name: nexa-live
    runtime: node
    region: frankfurt
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    # Bump to force Render to pick up postcode street-list fix (AB12 4TG).
    buildCommand: corepack enable && corepack prepare pnpm@11.5.3 --activate && pnpm install --frozen-lockfile --filter @hubflo/web... && NODE_OPTIONS=--max-old-space-size=3072 pnpm --filter @hubflo/web build && echo "nexa-postcode-lookup=street-list-v2"
    startCommand: corepack enable && pnpm --filter @hubflo/web start --hostname 0.0.0.0 --port $PORT
    disk:
      name: nexa-live-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=3072
      - key: NEXA_STORE_PATH
        value: /var/data/nexa-live.sqlite
      - key: NEXA_STORE_DIR
        value: /var/data
      - key: NEXA_WORKSPACE_MODE
        value: live
      - key: NEXA_AUTH_MODE
        value: users
      - key: NEXA_ADMIN_NAME
        value: Brian Kerr
      - key: NEXA_ADMIN_USERNAME
        value: brian.kerr
      - key: NEXA_ADMIN_EMPLOYEE_ID
        value: emp-brian
      - key: NEXA_ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://nexa-live.onrender.com
      # Preferred: direct simPRO OAuth for quote/job push while NeXa is the front end
      - key: SIMPRO_BASE_URL
        sync: false
      - key: SIMPRO_API_BASE_URL
        sync: false
      - key: SIMPRO_COMPANY_ID
        sync: false
      - key: SIMPRO_CLIENT_ID
        sync: false
      - key: SIMPRO_CLIENT_SECRET
        sync: false
      - key: SIMPRO_REFRESH_TOKEN_FILE
        value: /var/data/simpro_refresh_token.txt
      - key: SIMPRO_REFRESH_TOKEN
        sync: false
      - key: SIMPRO_DEFAULT_CUSTOMER_ID
        sync: false
      - key: SIMPRO_DEFAULT_SITE_ID
        sync: false
      - key: SIMPRO_WEBHOOK_SECRET
        sync: false
      # Optional temporary scheduler bridge fallback
      - key: SIMPRO_SCHEDULER_BASE_URL
        value: https://ewg-hub-scheduler.onrender.com
      - key: SIMPRO_SCHEDULER_QUOTE_PUSH_URL
        sync: false
      - key: SIMPRO_SCHEDULER_JOB_PUSH_URL
        sync: false
      - key: SIMPRO_SCHEDULER_HUB_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXA_OPENAI_API_KEY
        sync: false
      - key: NEXA_ASSISTANT_OPENAI_MODEL
        value: gpt-4.1-mini
      # Optional UK PAF street lookup. Ideal Postcodes is preferred; getAddress.io is a fallback.
      # Without keys NeXa uses Ideal Postcodes sandbox (ak_test) then OpenStreetMap.
      - key: IDEAL_POSTCODES_API_KEY
        sync: false
      - key: GETADDRESS_API_KEY
        sync: false
      - key: NEXA_POSTCODE_LOOKUP_VERSION
        value: street-list-v3
