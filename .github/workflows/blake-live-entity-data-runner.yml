name: Blake Live Entity Data Runner

on:
  push:
    branches:
      - fix/blake-live-entity-data-path

permissions:
  contents: write
  issues: write

env:
  NEXA_WORKSPACE_MODE: live
  NEXA_ENVIRONMENT: live
  NEXT_PUBLIC_NEXA_ENVIRONMENT: live
  NEXA_POSTGRES_MIRROR: "0"
  NEXA_TENANT_KEY: ewg-live

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply authoritative entity patch
        shell: bash
        run: |
          python - <<'PYRUN'
          from pathlib import Path
          source = Path('.github/workflows/blake-live-entity-data-fix.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("          PY\n", start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          exec(compile(script, '<blake-live-entity-patch>', 'exec'))
          PYRUN

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@11.5.3 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Full tests
        run: pnpm test
      - name: Production build
        run: NODE_OPTIONS=--max-old-space-size=3072 pnpm build
      - name: Production server smoke test
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter web exec next start -p 3100 > /tmp/blake-live-runner.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/blake-live-runner.log
          exit 1

      - name: Commit verified patch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/web/src/lib/workflow-data.ts \
            apps/web/src/lib/lead-store.ts \
            apps/web/src/lib/people-data.ts \
            apps/web/src/lib/hub-detail-store.ts \
            apps/web/src/lib/blake-core/entity-resolution.ts \
            apps/web/src/lib/blake-core/human-entity-capabilities.ts \
            apps/web/src/lib/blake-human-entity-resolution.test.ts
          if git diff --cached --quiet; then
            echo "Verified patch already committed."
          else
            git commit -m "Fix Blake live entity data freshness"
            git push origin HEAD:fix/blake-live-entity-data-path
          fi

      - name: Publish validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then result=success; else result=failure; fi
          head_sha=$(git rev-parse HEAD)
          gh issue comment 225 --repo "$GITHUB_REPOSITORY" --body "LIVE_ENTITY_RUNNER status=${result} sha=${head_sha} run=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
