name: Commit Blake Live Entity Fix

on:
  push:
    branches:
      - fix/blake-live-entity-data-path

permissions:
  contents: write

jobs:
  commit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          python - <<'PYRUN'
          from pathlib import Path
          source = Path('.github/workflows/blake-live-entity-data-fix.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("          PY\n", start)
          block = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          exec(compile(script, '<blake-live-entity-patch>', 'exec'))
          PYRUN

      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/web/src/lib/workflow-data.ts \
            apps/web/src/lib/lead-store.ts \
            apps/web/src/lib/people-data.ts \
            apps/web/src/lib/hub-detail-store.ts \
            apps/web/src/lib/blake-core/entity-resolution.ts \
            apps/web/src/lib/blake-core/human-entity-capabilities.ts \
            apps/web/src/lib/blake-human-entity-resolution.test.ts
          if git diff --cached --quiet; then
            echo "Source patch already present."
            exit 0
          fi
          git commit -m "Fix Blake live entity data freshness"
          git push origin HEAD:fix/blake-live-entity-data-path
