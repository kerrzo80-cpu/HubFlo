name: Live deploy smoke

on:
  push:
    branches:
      - codex/ai-surveyor-estimator-takeoff
  workflow_dispatch:
    inputs:
      expect_commit:
        description: "Optional — require live /api/health commit to match (use after Manual Deploy / promote)"
        required: false
        default: ""
  schedule:
    # Catch silent overnight breakage (UTC).
    - cron: "15 */6 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Render deploys often take 3–8 minutes; settle retries cover that window.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Smoke live (wait through deploy, then hold)
        env:
          NEXA_SMOKE_BASE_URL: https://nexa-live.onrender.com
          # Wait up to 10 minutes for Render cutover 502s to clear.
          NEXA_SMOKE_SETTLE_SECONDS: "600"
          # Live autoDeploy is frozen. Do NOT require github.sha on every push — that
          # emails "failed" when live intentionally stays on the last Manual Deploy.
          # Only enforce commit match on manual promote (workflow_dispatch input).
          NEXA_SMOKE_EXPECT_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.expect_commit || '' }}
        run: node scripts/deploy-smoke.mjs --hold-seconds 90
