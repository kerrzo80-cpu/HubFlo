name: Fix Blake Live Duplicate Patch

on:
  push:
    branches:
      - fix/blake-live-entity-data-path

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicated patch blocks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/web/src/lib/blake-core/human-entity-capabilities.ts')
          text = p.read_text()
          dup = '''    const clientSites = getClientSites();\n    const sitesById = new Map(clientSites.map((site) => [site.id, site]));\n    const clientSites = getClientSites();\n    const sitesById = new Map(clientSites.map((site) => [site.id, site]));\n'''
          one = '''    const clientSites = getClientSites();\n    const sitesById = new Map(clientSites.map((site) => [site.id, site]));\n'''
          if dup in text:
              text = text.replace(dup, one, 1)
          p.write_text(text)

          p = Path('apps/web/src/lib/hub-detail-store.ts')
          text = p.read_text()
          block = '''function rehydrateHubDetailStateFromDisk() {\n  const diskHub = readServerStoreSnapshot("hub-detail-store") as HubDetailState | null;\n  if (!diskHub || typeof diskHub !== "object") return;\n  Object.keys(hubDetailState).forEach((key) => {\n    delete hubDetailState[key as keyof HubDetailState];\n  });\n  Object.assign(hubDetailState, diskHub);\n}\n\n'''
          double = block + block
          if double in text:
              text = text.replace(double, block, 1)
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/lib/blake-core/human-entity-capabilities.ts apps/web/src/lib/hub-detail-store.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove duplicate Blake live patch blocks"
          git push origin HEAD:fix/blake-live-entity-data-path
