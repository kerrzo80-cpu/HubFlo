<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blake · AI-First Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --slate: #202a36;
      --slate-soft: #2c3644;
      --brass: #8e743e;
      --brass-light: #b8a06a;
      --porcelain: #e7ecef;
      --white: #fff;
      --steel: #5d6673;
      --line: #d9dee5;
      --verdigris: #2e8c7d;
      --bind: #22c55e;
      --amber: #f6b23c;
      --risk: #e5484d;
      --font-display: "Sora", "Source Sans 3", sans-serif;
      --font-ui: "Source Sans 3", "Sora", sans-serif;
      --shadow: 0 18px 48px rgba(32, 42, 54, .08);
      --gradient: linear-gradient(135deg, #b8a06a 0%, #8e743e 55%, #5e4a24 100%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--slate);
      font-family: var(--font-ui);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(46,140,125,.12), transparent 50%),
        radial-gradient(ellipse 60% 40% at 90% 0%, rgba(142,116,62,.1), transparent 45%),
        linear-gradient(180deg, #f4f7f9 0%, var(--porcelain) 42%, #e2e8ec 100%);
      min-height: 100vh;
    }
    .shell { width: min(1180px, calc(100% - 24px)); margin: 0 auto; padding: 18px 0 48px; }
    .topbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .brand { display: flex; gap: 12px; align-items: center; }
    .mark {
      width: 42px; height: 42px; border-radius: 12px;
      background: var(--slate); color: var(--brass-light);
      display: grid; place-items: center; font-family: var(--font-display); font-weight: 700;
    }
    .brand strong { display: block; font-family: var(--font-display); font-size: 1.3rem; letter-spacing: -.02em; }
    .brand span { color: var(--steel); font-size: .86rem; }
    .pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 999px;
      border: 1px solid rgba(142,116,62,.35); background: rgba(255,255,255,.72);
      color: var(--brass); font-family: var(--font-display); font-size: .72rem;
      font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    }
    .pill::before {
      content: ""; width: 7px; height: 7px; border-radius: 50%;
      background: var(--verdigris); box-shadow: 0 0 0 4px rgba(46,140,125,.18);
    }
    .rail { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px; }
    .rail button {
      border: 0; background: transparent; color: var(--steel);
      font: inherit; font-weight: 600; font-size: .84rem;
      padding: 8px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    }
    .rail button.active { background: var(--slate); color: #fff; }
    .rail button:disabled { opacity: .35; cursor: not-allowed; }
    .stage {
      position: relative; border: 1px solid rgba(217,222,229,.9);
      border-radius: 28px; background: rgba(255,255,255,.9);
      box-shadow: var(--shadow); overflow: hidden; min-height: 580px;
    }
    .stage::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--gradient); }
    .panel { padding: 24px; animation: fade .35s ease both; }
    .eyebrow { margin: 0 0 8px; color: var(--brass); font-family: var(--font-display); font-size: .72rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-family: var(--font-display); font-size: clamp(1.6rem, 3.4vw, 2.2rem); letter-spacing: -.03em; line-height: 1.15; }
    .lede { margin: 10px 0 0; color: var(--steel); font-size: 1.02rem; line-height: 1.5; max-width: 42rem; }
    .prompt {
      margin-top: 22px; border: 1px solid var(--line); border-radius: 24px;
      background: linear-gradient(180deg, #fbfcfd, #f3f6f8); padding: 16px;
    }
    textarea {
      width: 100%; min-height: 110px; border: 0; resize: vertical;
      background: transparent; font: inherit; font-size: 1.15rem; outline: none; color: var(--slate);
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
    .chip, .btn, .ghost, .danger {
      appearance: none; border: 1px solid var(--line); background: #fff; color: var(--slate);
      font: inherit; font-weight: 600; font-size: .92rem; border-radius: 12px;
      padding: 10px 14px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center;
    }
    .btn { border-color: transparent; background: var(--slate); color: #fff; }
    .btn.primary { background: var(--verdigris); }
    .btn.brass { background: var(--gradient); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .ghost { background: transparent; }
    .danger { border-color: rgba(229,72,77,.3); color: var(--risk); background: rgba(229,72,77,.06); }
    .examples { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .examples button { border: 0; background: transparent; color: var(--verdigris); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .card { margin-top: 18px; display: grid; gap: 14px; }
    .grid3, .grid2, .split { display: grid; gap: 12px; }
    .grid3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .grid2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .split { grid-template-columns: 1.15fr .85fr; margin-top: 18px; }
    .stat, .box, .qcard {
      border: 1px solid var(--line); border-radius: 16px; background: #fbfcfd; padding: 16px;
    }
    .stat label, .box h3, .qcard h3 {
      display: block; margin: 0 0 8px; color: var(--steel); font-size: .78rem;
      font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    }
    .box h3, .qcard h3 {
      font-family: var(--font-display); font-size: .95rem; text-transform: none; letter-spacing: 0; color: var(--slate);
      display: flex; justify-content: space-between; gap: 8px; align-items: center;
    }
    .stat strong { font-family: var(--font-display); font-size: 1.08rem; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px;
      font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    }
    .ai { background: rgba(142,116,62,.12); color: var(--brass); border: 1px solid rgba(142,116,62,.28); }
    .ok { background: rgba(34,197,94,.12); color: #168a45; }
    .lock { background: rgba(246,178,60,.16); color: #9a6a10; }
    .live { background: rgba(46,140,125,.12); color: var(--verdigris); }
    .draft { background: rgba(93,102,115,.1); color: var(--steel); }
    ul.miss, ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    ul.miss { grid-template-columns: repeat(2, minmax(0,1fr)); }
    ul.miss li, ul.plain li { display: flex; gap: 8px; align-items: flex-start; font-size: .93rem; padding: 6px 0; border-bottom: 1px dashed rgba(217,222,229,.8); }
    ul.miss li.current { background: rgba(46,140,125,.08); border-radius: 10px; padding: 8px 10px; border: 1px solid rgba(46,140,125,.28); border-bottom: 1px solid rgba(46,140,125,.28); }
    .markdot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); flex-shrink: 0; display: grid; place-items: center; font-size: .7rem; margin-top: 1px; }
    li.done .markdot { border-color: var(--bind); background: rgba(34,197,94,.12); color: #168a45; }
    li.current .markdot { border-color: var(--verdigris); background: rgba(46,140,125,.12); color: var(--verdigris); }
    li.done .ans { display: block; color: var(--verdigris); font-size: .84rem; margin-top: 2px; }
    .q-now { border-color: rgba(46,140,125,.35); background: rgba(46,140,125,.04); margin-top: 12px; }
    .q-now textarea { min-height: 72px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; }
    .intake-progress { margin-top: 4px; }
    .progress strong { font-family: var(--font-display); font-size: 1.5rem; }
    .track { height: 10px; border-radius: 999px; background: #e2e7ec; overflow: hidden; margin-top: 8px; }
    .fill { height: 100%; background: linear-gradient(90deg, var(--verdigris), #3aa894); transition: width .5s ease; }
    .note { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(246,178,60,.12); border: 1px solid rgba(246,178,60,.35); color: #8a5d0c; font-size: .92rem; }
    .note.ready { background: rgba(34,197,94,.1); border-color: rgba(34,197,94,.35); color: #147a3c; }
    .chat { display: flex; flex-direction: column; gap: 10px; max-height: 280px; overflow: auto; }
    .bubble { max-width: 92%; padding: 12px 14px; border-radius: 16px; font-size: .94rem; line-height: 1.45; }
    .bubble.c { align-self: flex-start; background: #eef2f5; border-bottom-left-radius: 6px; }
    .bubble.a { align-self: flex-end; background: rgba(46,140,125,.1); border: 1px solid rgba(46,140,125,.2); border-bottom-right-radius: 6px; }
    .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .photo {
      aspect-ratio: 4/3; border-radius: 12px; border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(32,42,54,.08), rgba(46,140,125,.18));
      display: grid; place-items: end start; padding: 10px; font-size: .78rem; font-weight: 600;
    }
    .commercial {
      margin-top: 14px; padding: 18px; border-radius: 18px;
      background: linear-gradient(135deg, #243140, #1a222c); color: #f4f6f8;
      display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px;
    }
    .commercial label { display: block; color: rgba(244,246,248,.62); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    .commercial strong { font-family: var(--font-display); font-size: 1.2rem; }
    .alert { display: grid; grid-template-columns: 8px 1fr; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; margin-bottom: 8px; }
    .alert .bar { border-radius: 999px; background: var(--amber); }
    .alert.info .bar { background: var(--verdigris); }
    .alert h4 { margin: 0 0 4px; font-family: var(--font-display); font-size: .92rem; }
    .alert p { margin: 0; color: var(--steel); font-size: .88rem; }
    .schedule {
      margin-top: 18px; padding: 20px; border-radius: 20px;
      border: 1px solid rgba(142,116,62,.28);
      background: radial-gradient(circle at 90% 10%, rgba(184,160,106,.18), transparent 40%), linear-gradient(180deg,#fff,#f7f5f0);
    }
    .gate { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fbfcfd; margin-top: 8px; font-size: .92rem; }
    .gate.ready { border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.06); }
    .invoice { margin-top: 16px; border: 1px solid var(--line); border-radius: 18px; padding: 18px; background: #fff; opacity: .45; }
    .invoice.on { opacity: 1; }
    .invoice .line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
    .invoice .total { display: flex; justify-content: space-between; margin-top: 12px; font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; }
    .audit { list-style: none; margin: 18px 0 0; padding: 0; }
    .audit li { display: grid; grid-template-columns: 64px 88px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
    .audit .t { color: var(--steel); font-weight: 600; font-variant-numeric: tabular-nums; }
    .audit .who { font-family: var(--font-display); font-weight: 700; font-size: .82rem; color: var(--brass); }
    .audit .who.human { color: var(--verdigris); }
    .audit .d { color: var(--steel); font-size: .86rem; margin-top: 2px; }
    .toast {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      background: var(--slate); color: #fff; padding: 12px 16px; border-radius: 14px;
      box-shadow: 0 16px 40px rgba(32,42,54,.28); z-index: 20; max-width: min(520px, calc(100% - 24px));
    }
    .thinking { margin-top: 14px; color: var(--steel); }
    .hidden { display: none !important; }
    @media (max-width: 860px) {
      .grid3, .grid2, .split, ul.miss, .commercial, .audit li { grid-template-columns: 1fr; }
      .audit .who { grid-column: 2; }
      .panel { padding: 18px 14px; }
    }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark">X</div>
        <div>
          <strong>Ayla</strong>
          <span>AI-first operating system · clickable prototype</span>
        </div>
      </div>
      <div class="pill">AI First · Human Approved</div>
    </header>

    <nav class="rail" id="rail"></nav>
    <main class="stage" id="stage"></main>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script>
    const EXAMPLE = "Mrs Smith from Hillside Avenue wants a complete heating system replacement.";
    const playbooks = {
      heating: {
        name: "Heating System Playbook",
        jobType: "Heating System Renewal",
        fields: [
          ["address","Full address","14 Hillside Avenue, Harrogate"],
          ["postcode","Postcode","HG2 7PL"],
          ["phone","Phone number","07700 900214"],
          ["email","Email","mrs.smith@email.com"],
          ["property","Property type","Semi-detached house"],
          ["bedrooms","Number of bedrooms","3 bedrooms"],
          ["boiler","Existing boiler","15-year Worcester combi"],
          ["cylinder","Existing cylinder?","No — combi system"],
          ["radiators","Number of radiators","9 radiators"],
          ["gas","Gas available?","Yes — meter in kitchen"],
          ["pipework","Pipework accessible?","Mostly accessible under floors"],
          ["floors","Floors timber/concrete?","Ground timber, first floor timber"],
          ["location","Desired boiler location","Utility cupboard (current)"],
          ["occupied","Property occupied?","Yes — family in residence"],
          ["timescale","Timescale","Within 6 weeks"],
          ["photos","Photos","4 site photos attached"],
        ],
      },
      bathroom: {
        name: "Bathroom Playbook",
        jobType: "Bathroom Refurbishment",
        fields: [
          ["address","Full address","8 Oak Road, Leeds"],
          ["postcode","Postcode","LS8 2QR"],
          ["phone","Phone number","07700 900331"],
          ["suite","Suite preference","Modern white suite with walk-in shower"],
          ["tiling","Tiling extent","Full height wet walls + floor"],
          ["extract","Extraction required?","Yes — humidistat fan"],
          ["wetroom","Wet room conversion?","Partial wet zone"],
          ["access","Access constraints","First floor · stair carry"],
          ["timescale","Timescale","Next month"],
          ["photos","Photos","3 bathroom photos attached"],
        ],
      },
      radiator: {
        name: "Radiator Playbook",
        jobType: "Radiator Replacement",
        fields: [
          ["address","Full address","22 Mill Lane, York"],
          ["postcode","Postcode","YO10 4AB"],
          ["phone","Phone number","07700 900448"],
          ["count","Number of radiators","3 radiators"],
          ["sizes","Radiator sizes","600×1000, 600×800, 600×600"],
          ["valves","TRV upgrade?","Yes — TRV upgrade"],
          ["system","System type","Sealed system"],
          ["timescale","Timescale","This fortnight"],
          ["photos","Photos","2 radiator photos attached"],
        ],
      },
    };

    const quoteSections = [
      ["Scope of Works", ["Strip out existing Worcester combi","Supply and install A-rated combi","Replace 9 radiators with TRVs","Flush, dose, commission","Gas Safe certification"]],
      ["Assumptions", ["Existing gas/flue route suitable","No major pipework reroutes","Clear access during 3-day programme"]],
      ["Exclusions", ["Decoration making-good","Consumer unit upgrades","Asbestos removal if found"]],
      ["Labour", ["Heating engineer × 3 days — £1,440","Mate × 2 days — £640","Commissioning — £180"]],
      ["Materials", ["Worcester 8000 Style 35kW — £1,850","9× radiators + TRVs — £1,120","Flush chemicals & sundries — £210"]],
      ["Cost Centres", ["Boiler plant — £2,180","Radiators — £1,420","Labour — £2,260","Contingency 5% — £293"]],
      ["Risk notes", ["Floor access may add pipework time","Flue termination to confirm on photos"]],
      ["Suggested programme", ["Day 1 — strip-out & boiler","Day 2 — radiators & flush","Day 3 — commission & handover"]],
    ];

    const state = {
      screen: "intake",
      prompt: "",
      lead: "none",
      playbookId: "heating",
      customer: "Mrs Smith",
      answered: false,
      photos: false,
      quote: "locked",
      job: "none",
      schedule: "none",
      invoice: "locked",
      jobComplete: false,
      audit: [],
      conversation: [],
      answers: {},
      tick: 0,
    };

    const screens = [
      ["intake","Intake",1],
      ["lead","Lead",2],
      ["quote","Quote",3],
      ["job","Job",4],
      ["scheduler","Schedule",5],
      ["invoice","Invoice",6],
      ["audit","Audit",7],
    ];

    function money(n){ return new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP",maximumFractionDigits: n%1?2:0}).format(n); }
    function toast(msg){
      const el = document.getElementById("toast");
      el.textContent = msg; el.classList.remove("hidden");
      clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add("hidden"), 2600);
    }
    function time(){
      state.tick += 1;
      const total = 9*60 + 12 + state.tick;
      return `${String(Math.floor(total/60)%24).padStart(2,"0")}:${String(total%60).padStart(2,"0")}`;
    }
    function audit(actor, action, detail){
      state.audit.push({ time: time(), actor, action, detail });
    }
    function detect(text){
      const t = text.toLowerCase();
      if (t.includes("bathroom") || t.includes("suite")) return "bathroom";
      if (t.includes("radiator") && !t.includes("heating system") && !t.includes("boiler")) return "radiator";
      return "heating";
    }
    function nameFrom(text){
      const m = text.match(/\b(Mrs|Mr|Ms|Miss)\s+([A-Za-z'-]+)/i);
      return m ? `${m[1]} ${m[2]}` : "New customer";
    }
    function unlocked(id){
      if (id === "intake" || id === "audit") return true;
      if (id === "lead") return state.lead !== "none" && state.lead !== "thinking";
      if (id === "quote") return state.quote !== "locked" || state.answered;
      if (id === "job" || id === "scheduler") return state.job !== "none";
      if (id === "invoice") return state.schedule === "approved" || state.jobComplete || state.invoice !== "locked";
      return false;
    }
    function pb(){ return playbooks[state.playbookId]; }
    function mandatoryFields(){ return pb().fields; }
    function answeredCount(){ return mandatoryFields().filter(([id]) => state.answers[id]).length; }
    function totalMandatory(){ return mandatoryFields().length; }
    function missingFields(){ return mandatoryFields().filter(([id]) => !state.answers[id]); }
    function currentField(){ return missingFields()[0] || null; }
    function progress(){
      if (state.answered) return 100;
      const total = totalMandatory();
      return total ? Math.round((answeredCount() / total) * 100) : 0;
    }
    function missingCount(){ return state.answered ? 0 : missingFields().length; }

    const questionText = {
      address: "What's the full property address?",
      postcode: "And the postcode?",
      phone: "What's the best contact number?",
      email: "What email should we use?",
      property: "What type of property is it?",
      bedrooms: "How many bedrooms?",
      boiler: "What existing boiler is installed?",
      cylinder: "Is there a cylinder, or is it a combi system?",
      radiators: "How many radiators are in the property?",
      gas: "Is gas available on site?",
      pipework: "How accessible is the pipework?",
      floors: "Are the floors timber or concrete?",
      location: "Where would you like the boiler located?",
      occupied: "Will the property be occupied during works?",
      timescale: "What's the preferred timescale?",
      photos: "Can you attach any site photos?",
      count: "How many radiators need replacing?",
      sizes: "What sizes are the radiators?",
      valves: "Do you want TRV upgrades?",
      system: "What system type is it?",
      suite: "Any suite preferences?",
      tiling: "What tiling scope are you looking for?",
      extract: "Is extraction required?",
      wetroom: "Are you considering a wet room?",
      access: "Any access constraints?",
    };
    function questionFor(field){
      return questionText[field[0]] || `${field[1]}?`;
    }

    function prefillAnswers(text){
      const answers = {};
      const numWords = { one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10 };
      let m = text.match(/\b(\d+)\s+([A-Za-z]+(?:\s+[A-Za-z]+)?\s+(?:Avenue|Road|Lane|Street|Drive|Close|Way|Court))(?:,\s*([A-Za-z\s]+))?/i);
      if (m) {
        answers.address = m[3] ? `${m[1]} ${m[2]}, ${m[3].trim()}` : `${m[1]} ${m[2]}`;
      } else {
        m = text.match(/(?:from|on)\s+([A-Za-z]+(?:\s+[A-Za-z]+)?\s+(?:Avenue|Road|Lane|Street|Drive|Close|Way|Court))/i);
        if (!m) m = text.match(/\b([A-Za-z]+\s+(?:Avenue|Road|Lane|Street|Drive|Close|Way|Court))\b/i);
        if (m) answers.address = m[1].trim();
      }
      m = text.match(/\b(one|two|three|four|five|six|seven|eight|nine|ten|\d+)\s+radiators?\b/i);
      if (m) {
        const n = numWords[m[1].toLowerCase()] || m[1];
        const val = `${n} radiators`;
        if (mandatoryFields().some(([id]) => id === "count")) answers.count = val;
        if (mandatoryFields().some(([id]) => id === "radiators")) answers.radiators = val;
      }
      return answers;
    }

    function askNextQuestion(){
      const field = currentField();
      if (!field) return;
      const last = state.conversation[state.conversation.length - 1];
      if (last && last.role === "a" && last.fieldId === field[0]) return;
      state.conversation.push({ role:"a", text: questionFor(field), fieldId: field[0] });
    }

    function finishIntake(){
      state.answered = true;
      state.photos = true;
      state.lead = "ready";
      state.quote = "draft";
      state.conversation.push({
        role:"a",
        text:`All mandatory ${pb().name} questions are complete. I'm building the quote now.`,
      });
      audit("AI", "AI completed mandatory questions", `${totalMandatory()} fields from playbook`);
      audit("AI", "AI generated Quote", `AI Draft · ${pb().jobType}`);
      toast("Mandatory information complete — quote drafted");
      state.screen = "quote";
      render();
    }

      const field = currentField();
      const trimmed = (value || "").trim();

      const [id, label] = field;
      state.answers[id] = trimmed;
      state.conversation.push({ role:"c", text: trimmed });
      audit("Customer", `Answered ${label}`, trimmed);
      if (missingCount() === 0) {
        finishIntake();
      } else {
        askNextQuestion();
        render();
      }
    }

        remaining.forEach(([id, label, demo]) => {
          state.answers[id] = demo;
          state.conversation.push({ role:"c", text: demo });
          audit("Customer", `Answered ${label}`, demo);
        });
        state.conversation.push({

        finishIntake();

      state.screen = id;
      render();

          finishIntake();

          render();

      document.querySelectorAll("[data-go]").forEach(el => el.addEventListener("click", () => go(el.getAttribute("data-go"))));

        const btn = e.target.closest("button[data-go]");

      const prompt = document.getElementById("prompt");
      if (prompt) prompt.oninput = () => { state.prompt = prompt.value; };

      if (run) run.onclick = () => runIntake(document.getElementById("prompt").value);

      if (demoAns) demoAns.onclick = fillDemoAnswer;
      const fillRemaining = document.getElementById("fillRemaining");
      if (fillRemaining) fillRemaining.onclick = fillRemainingDemo;
      ["ask","ask2","reqPhotos","surveyBtn"].forEach(id => {

        el.onclick = () => {
          if (id === "reqPhotos") { audit("AI","AI requested photos","Boiler, flue, cupboard, radiators"); toast("Photo request sent to customer"); }

          else { audit("AI","AI asked customer for missing info","Outstanding playbook fields"); toast("Customer request sent (simulated)"); }

        state.jobComplete = true; state.invoice = "prepared";
        audit("Brian","Brian marked Job complete","All checklists passed");
        audit("AI","AI prepared Invoice","Locked until approval");
        toast("Job complete — invoice prepared by AI"); go("invoice");
      };
      const approveInv = document.getElementById("approveInv");
      if (approveInv) approveInv.onclick = () => { state.invoice="approved"; audit("Brian","Brian approved Invoice", money(7383.6)); toast("Invoice approved — ready to send"); render(); };
      const sendInv = document.getElementById("sendInv");
      if (sendInv) sendInv.onclick = () => { state.invoice="sent"; audit("Brian","Brian sent Invoice","INV-2418 issued"); toast("Invoice sent"); render(); };
      const editQ = document.getElementById("editQ");
      if (editQ) editQ.onclick = () => toast("Edit opens a controlled review — prototype keeps AI draft intact");
      const resetBtn = document.getElementById("reset") || document.getElementById("reset2");
      if (resetBtn) resetBtn.onclick = reset;
    }

    render();
  </script>
</body>
</html>
